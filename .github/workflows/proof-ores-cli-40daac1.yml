name: proof ores-cli 40daac1

on:
  pull_request:
    paths:
      - '.github/workflows/proof-ores-cli-40daac1.yml'

permissions:
  contents: read

env:
  EXPECTED_HEAD: 40daac105e1e0ca76b4c086426f81bd70024887b
  TJSV_SHA: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.EXPECTED_HEAD }}
          path: subject
          persist-credentials: false
      - run: test "$(git -C subject rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_SHA }}
          path: subject/tmp/tjsv
          persist-credentials: false
      - run: test "$(git -C subject/tmp/tjsv rev-parse HEAD)" = "$TJSV_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - working-directory: subject/tmp/tjsv
        run: npm ci --omit=dev
      - working-directory: subject
        run: |
          set -euo pipefail
          test -x post-install.sh
          command -v zsh >/dev/null
          bash -n post-install.sh
          bash -n tests/post_install.sh
          bash -n tests/shell_install_contract.sh
          bash -n tests/tjsv_lifecycle_contract.sh
          bash -n tests/launcher_symlink_contract.sh
          bash tests/post_install.sh
          bash tests/shell_install_contract.sh
          bash tests/tjsv_lifecycle_contract.sh
          bash tests/launcher_symlink_contract.sh
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - working-directory: subject
        run: cargo metadata --locked --format-version 1 > /dev/null
      - working-directory: subject
        run: cargo fmt --all --check
      - working-directory: subject
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - working-directory: subject
        run: cargo test --all-targets --all-features --locked
      - working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tjsv-generated"
          node tmp/tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/infra-gitops/main.tsp \
            --schema=contracts/infra-gitops/authored.schema.json \
            --report="$RUNNER_TEMP/infra-gitops-parity.json" \
            --contract-ir="$RUNNER_TEMP/infra-gitops-contract-ir.json" \
            --output-dir="$RUNNER_TEMP/tjsv-generated"
          test -s "$RUNNER_TEMP/tjsv-generated/typespec.generated.schema.json"
          ORES_TJSV_REPORT="$RUNNER_TEMP/infra-gitops-parity.json" \
          ORES_TJSV_GENERATED_SCHEMA="$RUNNER_TEMP/tjsv-generated/typespec.generated.schema.json" \
            cargo test --locked --test tjsv_ci_fixture assert_success_evidence -- --exact --ignored --nocapture
      - working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cp contracts/infra-gitops/main.tsp "$RUNNER_TEMP/infra-gitops-typespec-drift.tsp"
          ORES_TJSV_FIXTURE="$RUNNER_TEMP/infra-gitops-typespec-drift.tsp" ORES_TJSV_FROM='supabaseRoot: string;' ORES_TJSV_TO='supabaseRoot: int32;' \
            cargo test --locked --test tjsv_ci_fixture mutate_typespec_once -- --exact --ignored --nocapture
          rm -rf "$RUNNER_TEMP/tjsv-typespec-drift-generated"
          set +e
          node tmp/tjsv/bin/typespec-json-schema-validator.mjs check --typespec="$RUNNER_TEMP/infra-gitops-typespec-drift.tsp" --schema=contracts/infra-gitops/authored.schema.json --report="$RUNNER_TEMP/infra-gitops-typespec-drift-report.json" --contract-ir="$RUNNER_TEMP/infra-gitops-typespec-drift-contract-ir.json" --output-dir="$RUNNER_TEMP/tjsv-typespec-drift-generated"
          rc=$?
          set -e
          test "$rc" -ne 0
          ORES_TJSV_REPORT="$RUNNER_TEMP/infra-gitops-typespec-drift-report.json" cargo test --locked --test tjsv_ci_fixture assert_rejection_evidence -- --exact --ignored --nocapture
      - working-directory: subject
        shell: bash
        run: |
          set -euo pipefail
          cp contracts/infra-gitops/authored.schema.json "$RUNNER_TEMP/infra-gitops-drift.schema.json"
          ORES_TJSV_FIXTURE="$RUNNER_TEMP/infra-gitops-drift.schema.json" ORES_TJSV_JSON_POINTER='/$defs/InfraGitOpsContract/properties/supabaseRoot/type' ORES_TJSV_JSON_VALUE='"integer"' \
            cargo test --locked --test tjsv_ci_fixture mutate_json_schema_value -- --exact --ignored --nocapture
          rm -rf "$RUNNER_TEMP/tjsv-negative-generated"
          set +e
          node tmp/tjsv/bin/typespec-json-schema-validator.mjs check --typespec=contracts/infra-gitops/main.tsp --schema="$RUNNER_TEMP/infra-gitops-drift.schema.json" --report="$RUNNER_TEMP/infra-gitops-negative-report.json" --contract-ir="$RUNNER_TEMP/infra-gitops-negative-contract-ir.json" --output-dir="$RUNNER_TEMP/tjsv-negative-generated"
          rc=$?
          set -e
          test "$rc" -ne 0
          ORES_TJSV_REPORT="$RUNNER_TEMP/infra-gitops-negative-report.json" ORES_TJSV_CONTRACT_IR="$RUNNER_TEMP/infra-gitops-negative-contract-ir.json" \
            cargo test --locked --test tjsv_ci_fixture assert_rejection_evidence -- --exact --ignored --nocapture
      - working-directory: subject
        run: cargo run --quiet --locked -- audit repo --path . --profile baseline > "$RUNNER_TEMP/repo-audit.jsonl"
      - working-directory: subject
        run: cargo run --quiet --locked -- audit package --path . > "$RUNNER_TEMP/package-audit.jsonl"
      - working-directory: subject
        run: |
          set -euo pipefail
          cargo run --quiet --locked -- --no-json audit package --path . > "$RUNNER_TEMP/package-audit.txt"
          grep -F 'status=passed command=audit package' "$RUNNER_TEMP/package-audit.txt"
          if grep -Eq '^[[:space:]]*\{' "$RUNNER_TEMP/package-audit.txt"; then exit 1; fi
      - run: |
          set -euo pipefail
          git -C subject diff --exit-code
          git -C subject/tmp/tjsv diff --exit-code
